name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The print-critical geometry compiles without UIKit, so it can be tested
      # here rather than only on a device.
      - name: Test geometry
        run: swift test
        env:
          EXPORT_SAMPLES_DIR: ${{ runner.temp }}/exports

      # The tests wrote the sample as STL and 3MF. Audit them with an independent
      # reader: Python's own zipfile and XML parser, not the app's code.
      - name: Audit exported files
        run: python3 tools/check_stl.py "$RUNNER_TEMP"/exports/*

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project LidarScan3D.xcodeproj \
            -scheme LidarScan3D \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # App Review rejects a build without these, and a wiring mistake in project.yml
      # would otherwise only show up there.
      - name: Check App Store requirements
        run: |
          app=build/Build/Products/Release-iphoneos/LidarScan3D.app
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is not in the app bundle"; exit 1; }
          test -f "$app/SampleVase.obj" || { echo "::error::The sample scan is not in the app bundle"; exit 1; }
          icon=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$app/Info.plist" 2>/dev/null || true)
          [ "$icon" = "AppIcon" ] || { echo "::error::No app icon in Info.plist (got '$icon')"; exit 1; }
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption missing"; exit 1; }

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScan3D.app Payload/
          zip -qr LidarScan3D.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarScan3D-ipa
          path: LidarScan3D.ipa
